name: Container security
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the production artifact
        run: docker compose build --pull --no-cache api
      - name: Scan without exposing the Docker socket
        run: |
          mkdir -p "$RUNNER_TEMP/omnix-security"
          docker save -o "$RUNNER_TEMP/omnix-security/image.tar" omnix:local
          docker run --rm \
            -v "$RUNNER_TEMP/omnix-security/image.tar:/scan/image.tar:ro" \
            -v "$RUNNER_TEMP/omnix-security:/reports" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /scan/image.tar \
            --db-repository ghcr.io/aquasecurity/trivy-db:2 \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            --format json --output /reports/report.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "omnix-security/report.json").read_text())
          findings = [v for result in report.get("Results", []) for v in result.get("Vulnerabilities", [])]
          blockers = [v for v in findings if v["Severity"] == "CRITICAL" or (v["Severity"] == "HIGH" and v.get("FixedVersion"))]
          print("High findings:", sum(v["Severity"] == "HIGH" for v in findings))
          for v in blockers:
              print(f"BLOCKED: {v['VulnerabilityID']} {v['PkgName']} {v['InstalledVersion']} -> {v.get('FixedVersion') or 'no fix available'} ({v['Severity']})")
          if blockers:
              raise SystemExit("Critical or fixable High container vulnerabilities block publishing")
          PY
      - name: Keep the security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-security
          path: ${{ runner.temp }}/omnix-security/report.json
