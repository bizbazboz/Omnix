name: Verify
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate the single portable deployment
        run: |
          test "$(find . -type f \( -iname '*compose*.yaml' -o -iname '*compose*.yml' \) | wc -l)" -eq 1
          docker compose config --quiet
          python -m compileall -q backend scripts
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Run isolated application contracts
        run: python scripts/test.py
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build and boot a fresh installation
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify production boundaries
        run: docker run --rm --network omnix-production_default -v "$PWD/scripts/check_production.py:/checks/check.py:ro" omnix:local python /checks/check.py
      - name: Inspect startup failure
        if: failure()
        run: docker compose logs --tail=80
      - name: Remove ephemeral CI volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
  publish:
    needs: [configuration, tests, production, security, platforms]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Verify AMD64 and ARM64 production builds
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=platforms
          cache-to: type=gha,mode=max,scope=platforms
